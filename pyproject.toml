[build-system]
requires = ["hatchling >=1.24", "hatch-vcs >=0.4"]
build-backend = "hatchling.build"

[project]
name = "scikit_build_core"
authors = [
    { name = "Henry Schreiner", email = "henryfs@princeton.edu" },
]
description = "Build backend for CMake based projects"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Build Tools",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 4 - Resilient",
    "Development Status :: 5 - Production/Stable",
    "Typing :: Typed",
]

dynamic = ["version"]

dependencies = [
    "exceptiongroup >=1.0; python_version<'3.11'",
    "packaging >=23.2",
    "pathspec >=0.12.0",
    "tomli >=1.2.2; python_version<'3.11'",
    "typing-extensions >=4; python_version<'3.11'",
]
# Note: cmake and possibly ninja are also required if those are not already
# present (user controllable) - but a system version is fine.

[project.optional-dependencies]
wheels = [
    # 4.4.0's FindPython can't find Development.SABIModule on Windows
    # (https://gitlab.kitware.com/cmake/cmake/-/issues/27950); remove when
    # 4.4.1 is out
    "cmake; sys_platform!='win32'",
    "cmake!=4.4.0; sys_platform=='win32'",
    "ninja; sys_platform!='win32'",
]
wheel-free-setuptools = [
    'setuptools>=70.1',
]
setuptools = [
    'setuptools >=49; python_version<"3.12"',
    'setuptools >=66.1; python_version>="3.12"',
]
hatchling = [
    "hatchling >=1.24",
]

[project.urls]
Changelog = "https://scikit-build-core.readthedocs.io/en/latest/changelog.html"
Discussions = "https://github.com/orgs/scikit-build/discussions"
Documentation = "https://scikit-build-core.readthedocs.io"
Homepage = "https://github.com/scikit-build/scikit-build-core"
Issues = "https://github.com/scikit-build/scikit-build-core/issues"

[project.scripts]
# Recommended entry point
scikit-build = "scikit_build_core.__main__:main"
# This is to make `uvx scikit-build-core` work
scikit-build-core = "scikit_build_core.__main__:main"

[project.entry-points]
"distutils.commands".build_cmake = "scikit_build_core.setuptools.build_cmake:BuildCMake"
"distutils.setup_keywords".cmake_source_dir = "scikit_build_core.setuptools.build_cmake:cmake_source_dir"
"distutils.setup_keywords".cmake_args = "scikit_build_core.setuptools.build_cmake:cmake_args"
"distutils.setup_keywords".cmake_install_dir = "scikit_build_core.setuptools.build_cmake:cmake_install_dir"
"distutils.setup_keywords".cmake_process_manifest_hook = "scikit_build_core.setuptools.build_cmake:cmake_process_manifest_hook"
"distutils.setup_keywords".cmake_install_target = "scikit_build_core.setuptools.build_cmake:cmake_install_target"
"distutils.setup_keywords".cmake_with_sdist = "scikit_build_core.setuptools.build_cmake:cmake_with_sdist"
"setuptools.finalize_distribution_options".scikit_build_entry = "scikit_build_core.setuptools.build_cmake:finalize_distribution_options"
"validate_pyproject.tool_schema".scikit-build = "scikit_build_core.settings.skbuild_schema:get_skbuild_schema"
hatch.scikit-build = "scikit_build_core.hatch.hooks"
# New-style (dynamic-metadata 0.3) wrappers for the bundled plugins. The name
# matches the module path used by the legacy tool.scikit-build.metadata table,
# so one provider string works in both forms; it also keeps our names clear of
# dynamic-metadata's own dynamic_metadata.* names in the shared group.
"dynamic_metadata.provider"."scikit_build_core.metadata.regex" = "scikit_build_core.metadata.regex:Provider"
"dynamic_metadata.provider"."scikit_build_core.metadata.template" = "scikit_build_core.metadata.template:Provider"
"dynamic_metadata.provider"."scikit_build_core.metadata.setuptools_scm" = "scikit_build_core.metadata.setuptools_scm:Provider"
"dynamic_metadata.provider"."scikit_build_core.metadata.fancy_pypi_readme" = "scikit_build_core.metadata.fancy_pypi_readme:Provider"


[dependency-groups]
test-core = [
    "build >=0.8",
    "cattrs >=22.2",
    "filelock >=3.8",
    "hatchling >=1.24",
    "hatch-vcs >=0.4",
    "pip>=23; python_version<'3.13'",
    "pip>=24.1; python_version>='3.13'",
    "pytest >=7.2,!=9.1.0",  # 9.1.0 regression overriding params-fixtures: pytest-dev/pytest#13974
    "pytest-subprocess >=1.5",
    'setuptools >=49; python_version<"3.12"',
    'setuptools >=66.1; python_version>="3.12"',
    "virtualenv >=20.20",
    "wheel >=0.40",
]
test-parallel = [
    { include-group = "test-core" },
    'pytest-xdist >=3.1',
]
test-meta = [
    { include-group = "test-core" },
    "hatch-fancy-pypi-readme>=23.2",
    "setuptools-scm>=5",
]
test-numpy = [
    { include-group = "test-core" },
    "numpy>=1.24.1; python_version<'3.15' and platform_python_implementation!='PyPy' and (platform_system != 'Windows' or platform_machine != 'ARM64')",
    "numpy~=2.2; python_version=='3.10' and platform_python_implementation=='PyPy'",
    "numpy~=2.4.1; python_version=='3.11' and platform_python_implementation=='PyPy'",
]
test-pybind11 = [
    { include-group = "test-core" },
    "pybind11 >=2.11",
]
test-schema = [
    { include-group = "test-core" },
    "fastjsonschema>=2.16.2",
    "validate-pyproject>=0.21",
]
test = [
    { include-group = "test-core" },
    { include-group = "test-meta" },
    { include-group = "test-numpy" },
    { include-group = "test-parallel" },
    { include-group = "test-pybind11" },
]
cov = [
    { include-group = "test" },
    "pytest-cov",
]
dev = [
    { include-group = "cov" },
    { include-group = "test-schema" },
    "rich",
]
docs = [
    "click-extra[sphinx]",
    # 1.2.x removed ANSILiteralBlock's "text" parameter, breaking
    # sphinxcontrib-programoutput's ANSILiteralBlock(output, output) call
    "erbsland-sphinx-ansi <1.2; python_version>='3.10'",
    "furo",
    "hatchling",
    # 5.1 adds the "alert" extension (GitHub-style admonitions); it needs 3.11+,
    # and docs only build on modern Python, so keep an older floor elsewhere.
    "myst-parser >=5.1; python_version>='3.11'",
    "myst-parser >=0.13; python_version<'3.11'",
    "setuptools",
    "sphinx >=7.0",
    "sphinx-autodoc-typehints != 3.9.6",
    "sphinx-copybutton",
    "sphinx-inline-tabs",
    "sphinx-jsonschema",
    "sphinx-llm",
    "sphinx-tippy",
    "sphinxcontrib-programoutput >=0.19",
]


[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "src/scikit_build_core/_version.py"
build.targets.sdist.exclude = [".git", ".agents/", ".distro/", ".fmf/", ".github/", ".packit.yaml", ".readthedocs.yml"]


[tool.uv]
exclude-newer = "7 days"

# These provide CMake helpers used by the init templates (f2py_add_module,
# cython helpers); allow their freshly released versions so the generated
# example projects build under the global exclude-newer window.
[tool.uv.exclude-newer-package]
f2py-cmake = false
cython-cmake = false


[tool.pytest.ini_options]
minversion = "7.2"
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
    "error",
    "ignore:Config variable '.*' is unset, Python ABI tag may be incorrect:RuntimeWarning",
    "default:The distutils package is deprecated and slated for removal:DeprecationWarning",  # Caused by setuptools sometimes
    "default:The distutils.sysconfig module is deprecated, use sysconfig instead:DeprecationWarning",  # Caused by setuptools sometimes
    "default:check_home argument is deprecated and ignored.:DeprecationWarning",  # Caused by setuptools sometimes
    "ignore::scikit_build_core._vendor.pyproject_metadata.errors.ConfigurationWarning",
    "ignore:'_UnionGenericAlias' is deprecated and slated for removal in Python 3.17:DeprecationWarning",  # From cattrs 24.1.2 and other?
    "ignore:The 'wheel.metadata' package has been made private:DeprecationWarning",
    "ignore:version of cmake-example already set:UserWarning",  # Caused by setuptoools-scm 9+ being installed
    "default:tag.strict is not set:FutureWarning",  # setuptools-scm 10+ asks users to set tag.strict explicitly
    "default:Configuration was created without VcsEnvironment:DeprecationWarning",  # Leaked by vcs-versioning 2.x internals, even from its public API
    "default:The setuptools.file_finders entry point is deprecated:DeprecationWarning",  # setuptools-scm 10.3+ warns from its global entry point on every setuptools egg_info, including packages that do not use it
]
log_level = "INFO"
pythonpath = ["tests/utils"]
testpaths = ["tests"]
markers = [
    "broken_on_urct: Broken for now due to lib not found",
    "compile: Compiles code",
    "configure: Configures CMake code",
    "fortran: Fortran code",
    "integration: Full package build",
    "isolated: Needs an isolated virtualenv",
    "network: Needs a network connection to setup or run",
    "setuptools: Tests setuptools integration",
    "upstream: Intended to check our own development",
    "virtualenv: Needs a virtualenv",
]
norecursedirs = ["tests/packages/**"]


[tool.mypy]
files = ["src", "tests", "noxfile.py"]
exclude = [
    '^tests/packages/simplest_c/src/simplest/__init__.py',
    '^tests/packages/dynamic_metadata/src/dynamic/__init__.py',
    '^tests/packages/.*/setup.py',
]
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src", "$MYPY_CONFIG_FILE_DIR/tests/utils"]
python_version = "3.10"
warn_unused_configs = true
warn_unreachable = false
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
strict = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["scikit_build_core.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["numpy", "setuptools_scm", "hatch_fancy_pypi_readme", "virtualenv", "vcs_versioning.*"]
ignore_missing_imports = true


[tool.pylint]
py-version = "3.10"
jobs = "0"
reports.output-format = "colorized"
good-names = ["f"]
messages_control.disable = [
    "design",
    "fixme",
    "import-outside-toplevel",
    "invalid-name",
    "line-too-long",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "wrong-import-position",
    "unnecessary-ellipsis",  # Conflicts with Protocols
    "broad-except",
    "unused-argument",  # Handled by Ruff
    "redefined-builtin",  # ExceptionGroup is a builtin
    "using-exception-groups-in-unsupported-version",  # We are using a backport
    "duplicate-code", # Trips up on version
    "too-many-lines",
]


[tool.coverage]
run.source = ["scikit_build_core"]
run.omit = ["src/scikit_build_core/_vendor"]
run.disable_warnings = [
  "module-not-measured",  # Triggers in multithreaded context on build
  "no-sysmon",
  "couldnt-parse",  # site-customize is unparsable on latest GHA windows versions
]
report.exclude_also = [
    '\.\.\.',
    'if typing.TYPE_CHECKING:',
    'if TYPE_CHECKING:',
    'def __repr__',
    'if __name__ == "__main__":',
]


[tool.check-wheel-contents]
ignore = ["W002"]  # Triggers on __init__.py's


[tool.ruff]
show-fixes = true
exclude = ["src/scikit_build_core/_vendor/*", "docs/examples/generated/*"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # Disallow Any
    "C90",     # Complexity
    "COM",     # Trailing commas teach the formatter
    "CPY",     # Copyright notice at top of file
    "D",       # Too many doc requests
    "E501",    # Line too long
    "FIX",     # Hacks and todos
    "PLC0415", # Import should be at top of file
    "PLR09",   # Too many ...
    "PLR2004", # Magic value used in comparison
    "PT013",   # It's correct to import classes for typing!
    "S101",    # Use of assert detected
    "S603",    # subprocess untrusted input
    "S607",    # subprocess call
    "SLF001",  # Private members are okay to access
    "TD",      # Todo format
    "TID252",  # Relative imports are fine
]
typing-modules = ["scikit_build_core._compat.typing"]
isort.known-local-folder = ["pathutils"]
flake8-bugbear.extend-immutable-calls = [
  "packaging.version.Version",
  "packaging.specifiers.SpecifierSet",
]
flake8-builtins.ignorelist = ["copyright", "license", "__doc__"]

[tool.ruff.format]
docstring-code-format = true


[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Callable".msg = "Use collections.abc.Callable instead."
"typing.Iterator".msg = "Use collections.abc.Iterator instead."
"typing.Mapping".msg = "Use collections.abc.Mapping instead."
"typing.Sequence".msg = "Use collections.abc.Sequence instead."
"typing.Set".msg = "Use collections.abc.Set instead."
"typing.Self".msg = "Use scikit_build_core._compat.typing.Self instead."
"typing.TYPE_CHECKING".msg = "Use TYPE_CHECKING = False instead."
"typing_extensions.Self".msg = "Use scikit_build_core._compat.typing.Self instead."
"typing.assert_never".msg = "Add scikit_build_core._compat.typing.assert_never instead."
"tomli".msg = "Use scikit_build_core._compat.tomllib instead."
"tomllib".msg = "Use scikit_build_core._compat.tomllib instead."
"importlib_metadata".msg = "Use importlib.metadata directly instead."
"importlib.metadata.entry_points".msg = "Use scikit_build_core._compat.importlib.metadata.entry_points instead."
"pyproject_metadata".msg = "Use scikit_build_core._vendor.pyproject_metadata instead."
"setuptools.errors".msg = "Use scikit_build_core._compat.setuptools.errors instead."


[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "ANN", "FBT001", "INP"]
"noxfile.py" = ["T20", "TID251"]
".agents/skills/**/*.py" = ["T20"]
"src/scikit_build_core/resources/*.py" = ["PTH", "ARG002", "FBT"]
"src/scikit_build_core/_compat/**.py" = ["TID251"]
"src/scikit_build_core/settings/**.py" = ["FBT001", "FA"]
"src/scikit_build_core/file_api/**.py" = ["FA"]
"tests/conftest.py" = ["TID251"]
"tests/test_settings.py" = ["FA"]
"docs/**" = ["INP"]
"docs/examples/**" = ["ANN"]
"src/scikit_build_core/file_api/model/*.py" = ["N"]
"**/__main__.py" = ["T20"]


[tool.check-sdist]
sdist-only = ["src/scikit_build_core/_version.py"]


[tool.typos.default]
# Ignore cog's generated checksum lines, e.g. "(sum: Dz4otQAPQ9)"
extend-ignore-re = ['\(sum: [A-Za-z0-9+/]+\)']

[tool.typos.default.extend-words]
delocate = "delocate"
